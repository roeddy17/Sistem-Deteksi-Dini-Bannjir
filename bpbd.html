<!doctype html>
<html lang="id">

<body class="bpbd">

      <p class="side-l">Menu utama</p>
      <nav class="nav">
        <a href="#dashboard" data-r="dashboard"><span data-icon="dash" data-size="19"></span>Dashboard</a>
